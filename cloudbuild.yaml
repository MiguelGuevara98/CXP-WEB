# Pipeline de Cloud Build (se ejecuta con cada push por el trigger configurado en GCP).
# SOLO construye y publica la imagen en Artifact Registry.
# El despliegue a Cloud Run es MANUAL (ver README, sección "Despliegue").
steps:
  # Construye la imagen Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/cxp-web:$COMMIT_SHA'
      - '.'

  # Sube la imagen al registro
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/cxp-web:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
